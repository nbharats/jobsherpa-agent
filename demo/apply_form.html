<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobSherpa demo portal - apply</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .8rem 0 .2rem; }
  input, textarea { width: 100%; padding: .5rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; }
  .note { color: #555; font-size: .9rem; }
</style>
</head>
<body>
<h1>Apply: Demo Portal</h1>
<p class="note">Sample form for JobSherpa demonstrations. Nothing is sent anywhere.</p>
<form id="apply-form">
  <label for="full_name">Full name *</label>
  <input id="full_name" name="full_name" required>
  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel">
  <label for="linkedin">LinkedIn URL</label>
  <input id="linkedin" name="linkedin">
  <label for="resume">Resume (PDF) *</label>
  <input id="resume" name="resume" type="file" accept=".pdf" required>
  <label for="cover_letter">Cover letter</label>
  <textarea id="cover_letter" name="cover_letter" rows="6"></textarea>
  <button type="submit">Submit application</button>
</form>
<p id="success" hidden>Thank you! Your application was received.</p>
<script>
  document.getElementById('apply-form').addEventListener('submit', function (e) {
    e.preventDefault();
    this.hidden = true;
    document.getElementById('success').hidden = false;
  });
</script>
</body>
</html>
